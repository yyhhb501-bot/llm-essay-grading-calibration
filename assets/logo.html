<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>申论朱批 · 图像生成稿</title>
<style>
  html, body { margin: 0; padding: 0; }
  body { overflow: hidden; background: #FAF7F2; }
  #stage { position: fixed; left: 0; top: 0; }
</style>
</head>
<body>
<div id="stage"></div>
<script>
/*
 * 「申论朱批」图像生成稿（浏览器渲染后截图导出）
 * 用法：logo.html#144  → 144×144 小程序头像
 *       logo.html#512  → 512×512 母版
 *       logo.html#cover → 500×400 分享封面
 */
(function () {
  var variant = (location.hash || '#144').replace('#', '');
  var W = 144, H = 144, svg = '';

  // 朱砂红印章 SVG（方形头像是主体）：纸白底 + 微旋转红印 + 楷体四字
  function sealSVG(size, opts) {
    opts = opts || {};
    var s = size / 144; // 缩放系数
    var rot = opts.noRotate ? '' : ' transform="rotate(2.5 72 72)"';
    return '<g' + rot + '>' +
      '<rect x="14" y="14" width="116" height="116" rx="20" fill="#B03A2E"/>' +
      '<rect x="14" y="14" width="116" height="116" rx="20" fill="none" stroke="#8E2A20" stroke-width="2"/>' +
      '<rect x="23" y="23" width="98" height="98" rx="13" fill="none" stroke="#FFF8EF" stroke-opacity="0.55" stroke-width="2.4"/>' +
      '<g font-family="KaiTi, STKaiti, SimSun, serif" font-weight="700" font-size="37" fill="#FFF8EF" text-anchor="middle" dominant-baseline="central">' +
      '<text x="47" y="52">申</text><text x="97" y="52">论</text>' +
      '<text x="47" y="96">朱</text><text x="97" y="96">批</text>' +
      '</g></g>';
  }

  if (variant === '144' || variant === '512') {
    W = H = parseInt(variant, 10);
    svg = '<svg width="' + W + '" height="' + H + '" viewBox="0 0 144 144" xmlns="http://www.w3.org/2000/svg">' +
      '<rect width="144" height="144" fill="#FAF7F2"/>' + sealSVG(W) + '</svg>';
  } else if (variant === 'cover') {
    W = 500; H = 400;
    svg = '<svg width="500" height="400" viewBox="0 0 500 400" xmlns="http://www.w3.org/2000/svg">' +
      '<rect width="500" height="400" fill="#FAF7F2"/>' +
      // 细金分隔线与标题区
      '<line x1="46" y1="238" x2="316" y2="238" stroke="#A67B1E" stroke-opacity="0.6" stroke-width="1.5"/>' +
      '<g font-family="KaiTi, STKaiti, SimSun, serif" font-weight="700" text-anchor="start">' +
      '<text x="44" y="150" font-size="72" fill="#2B2A26">申论朱批</text>' +
      '</g>' +
      '<g font-family="KaiTi, STKaiti, SimSun, serif" text-anchor="start">' +
      '<text x="46" y="196" font-size="22" fill="#7A7265">七位名师方法 · 逐句朱批 · 踩点给分</text>' +
      '<text x="46" y="274" font-size="17" fill="#A67B1E">批改 · 解题陪练 · 拍照识别 · 备考规划</text>' +
      '</g>' +
      '<g transform="translate(330 96) scale(1.05)">' + sealSVG(144, { noRotate: false }) + '</g>' +
      '<text x="46" y="366" font-size="13" fill="#B9AE9B">AI 批改仅供参考，请以官方评分为准</text>' +
      '</svg>';
  }

  document.getElementById('stage').innerHTML = svg;
  document.body.style.width = W + 'px';
  document.body.style.height = H + 'px';
  document.title = 'ready-' + W + 'x' + H;
})();
</script>
</body>
</html>
