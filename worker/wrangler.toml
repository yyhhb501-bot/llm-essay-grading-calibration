# worker/wrangler.toml —— Cloudflare Workers 部署配置（方案-网站.md §2 / §7）
#
# 用法（在 worker/ 目录下执行）：
#   npm install -g wrangler
#   wrangler login
#   wrangler secret put ACCESS_CODE      # 访问口令，发给朋友
#   wrangler secret put ZHIPU_API_KEY    # 你的智谱 API Key
#   wrangler deploy
#
# 静态资源由 [assets] 绑定：directory 指向 ../site，
# Worker 里通过 env.ASSETS.fetch(request) 兜底服务（见 worker.js）。

name = "shenlun-zhupi"
main = "worker.js"
compatibility_date = "2024-09-23"

[assets]
directory = "../site"
binding = "ASSETS"

# 自定义域名：workers.dev 在大陆被 DNS 污染，用自有域名访问（域名在账号下已 active）
routes = [
  { pattern = "shenlundawang.asia", custom_domain = true }
]